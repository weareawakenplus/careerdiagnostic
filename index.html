<!doctype html>
<html lang="en">

  <title>Awaken+ Career Diagnostic</title>
  <meta name="theme-color" content="#7c3aed" />
  <style>
    :root{ --bg:#f7f9fc; --vh:1vh; }
    html,body{height:100%;margin:0;background:var(--bg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    /* make the app fill the real viewport height on mobile */
    gradio-app{ display:block; width:100%; height:calc(var(--vh)*100); max-width:100%; margin:0 auto; }
    .wrap{ max-width: 100%; margin:0 auto; padding:0; }
    /* optional subtle container look */
    gradio-app::part(app){ border-radius:12px; box-shadow:0 2px 16px rgba(16,24,40,.06); background:#fff; }
  </style>
  <script>
    // Mobile viewport height fix (iOS/Android browser chrome)
    const setVh = () => document.documentElement.style.setProperty('--vh', (window.innerHeight*0.01) + 'px');
    addEventListener('resize', setVh); addEventListener('orientationchange', setVh); setVh();
  </script>

  <!-- Gradio web component (loads the app WITHOUT Hugging Face header) -->
  <script type="module" src="https://gradio.s3-us-west-2.amazonaws.com/5.44.1/gradio.js"></script>
</head>
