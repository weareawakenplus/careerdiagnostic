<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Critical for mobile scaling on all OS -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Awaken+ Career Diagnostic</title>
  <meta name="description" content="A quick diagnostic to locate your career stage and unlock next steps." />
  <meta name="theme-color" content="#7c3aed" />

  <!-- Perf preconnects -->
  <link rel="preconnect" href="https://huggingface.co">
  <link rel="preconnect" href="https://awakenplus-career-transition.hf.space" crossorigin>

  <style>
    :root{
      --bg:#f7f9fc; --maxw:860px; --radius:12px;
      /* Fallback; real height set via JS for iOS/Android URL bars */
      --vh: 1vh;
    }

    /* Base */
    html, body { margin:0; padding:0; height:100%; background:var(--bg); }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color:#1f2430; }

    .wrap { max-width:var(--maxw); margin:0 auto; padding:12px; }
    .bar {
      display:flex; align-items:center; justify-content:flex-end; gap:8px;
      margin:8px 0 12px;
    }
    .open-full {
      display:inline-block; text-decoration:none; font-weight:800;
      background:#7c3aed; color:#fff; padding:10px 14px; border-radius:9999px;
      box-shadow:0 2px 10px rgba(124,58,237,.25);
    }

    /* Responsive iframe that fills the usable viewport height */
    .frame {
      width: 100%;
      height: calc(var(--vh) * 100); /* robust across iOS/Android/desktop */
      border: 0;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 2px 16px rgba(16,24,40,.06);
    }

    /* Tighter padding for small screens */
    @media (max-width: 480px){
      .wrap { padding: 8px; }
    }
  </style>

  <script>
    // Cross-OS viewport height fix (iOS & Android URL bar changes)
    function setVhUnit() {
      var vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    }
    setVhUnit();
    window.addEventListener('resize', setVhUnit);
    window.addEventListener('orientationchange', setVhUnit);
  </script>
</head>
<body>
  <div class="wrap">
    <!-- Always show a reliable full-screen option -->
    <div class="bar">
      <a class="open-full"
         href="https://awakenplus-career-transition.hf.space"
         target="_top" rel="noopener">
        Open full screen
      </a>
    </div>

    <!-- Embedded app (works across OS; full height with the vh fix) -->
    <iframe
      class="frame"
      src="https://awakenplus-career-transition.hf.space"
      title="Awaken+ Career Diagnostic"
      allow="clipboard-read; clipboard-write; fullscreen"
      referrerpolicy="no-referrer"
      loading="eager"
    ></iframe>

    <noscript>
      <p style="text-align:center; margin-top:12px;">
        JavaScript is required. <a href="https://awakenplus-career-transition.hf.space">Open the diagnostic</a>.
      </p>
    </noscript>
  </div>
</body>
</html>
