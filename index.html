<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Awaken+ Career Diagnostic</title>
  <meta name="theme-color" content="#7c3aed" />
  <style>
    :root{ --bg:#f7f9fc; --maxw:860px; --radius:12px; --vh:1vh; }
    html,body{height:100%;margin:0;background:var(--bg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1f2430}
    .wrap{max-width:var(--maxw);margin:0 auto;padding:12px}
    .frame{width:100%;height:calc(var(--vh) * 100);border:0;border-radius:var(--radius);
      background:#fff;box-shadow:0 2px 16px rgba(16,24,40,.06)}
    .fallback{display:none; text-align:center; margin-top:12px}
    .btn{display:inline-block;background:#7c3aed;color:#fff;text-decoration:none;
      padding:12px 18px;border-radius:9999px;font-weight:800}
    @media (max-width:480px){ .wrap{padding:8px} }
  </style>
  <script>
    // Make the iframe fill the *actual* viewport height on iOS/Android
    const setVh = () => document.documentElement.style.setProperty('--vh',(window.innerHeight*0.01)+'px');
    addEventListener('resize', setVh); addEventListener('orientationchange', setVh); setVh();

    // If the iframe fails to load within 5s, redirect to a fallback URL automatically.
    // Order: hf.space embed -> huggingface.co embed -> app host
    const URLS = [
      "https://hf.space/embed/awakenplus/career-transition/+?__theme=light",
      "https://huggingface.co/spaces/awakenplus/career-transition?embed=true&__theme=light",
      "https://awakenplus-career-transition.hf.space/?__theme=light"
    ];
    let loaded = false;

    function onFrameLoaded(){ loaded = true; }

    function startFallbackTimer(){
      setTimeout(() => {
        if (!loaded) {
          // try next best destination (embed on huggingface.co)
          window.location.replace(URLS[1]);
        }
      }, 5000);
    }

    document.addEventListener('DOMContentLoaded', startFallbackTimer);
  </script>
</head>
<body>
  <div class="wrap">
    <!-- Primary: official embed endpoint (hides HF chrome) -->
    <iframe
      class="frame"
      src="https://hf.space/embed/awakenplus/career-transition/+?__theme=light"
      title="Awaken+ Career Diagnostic"
      allow="clipboard-read; clipboard-write; fullscreen"
      referrerpolicy="no-referrer"
      loading="eager"
      onload="onFrameLoaded()"
    ></iframe>

    <!-- Visible only if JS is off -->
    <noscript>
      <div class="fallback">
        <a class="btn" href="https://huggingface.co/spaces/awakenplus/career-transition?embed=true&__theme=light">
          Open the diagnostic
        </a>
      </div>
    </noscript>
  </div>
</body>
</html>
