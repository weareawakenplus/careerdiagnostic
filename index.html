<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Awaken+ Career Diagnostic</title>
  <meta name="theme-color" content="#7c3aed" />

  <style>
    :root { --bg:#f7f9fc; --vh:1vh; }
    html,body { margin:0; height:100%; background:var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    /* Fill the real mobile viewport height (prevents “desktop look”) */
    gradio-app { display:block; width:100%; height:calc(var(--vh) * 100); }
    /* Optional subtle card look */
    gradio-app::part(app) { border-radius:12px; box-shadow:0 2px 16px rgba(16,24,40,.06); background:#fff; }
  </style>

  <script>
    // Mobile viewport height fix for iOS/Android browser chrome
    const setVh = () => document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
    addEventListener('resize', setVh); addEventListener('orientationchange', setVh); setVh();
  </script>

  <!-- Official Gradio web component: renders the Space WITHOUT Hugging Face header/chrome -->
  <script type="module" src="https://gradio.s3-us-west-2.amazonaws.com/5.44.1/gradio.js"></script>
</head>
<body>
  <!-- IMPORTANT: point to your hf.space host. No ?embed= needed, and no Hugging Face header will appear. -->
  <gradio-app src="https://awakenplus-career-transition.hf.space?__theme=light"></gradio-app>

  <noscript>
    <p style="text-align:center;margin-top:16px">
      JavaScript is required. <a href="https://awakenplus-career-transition.hf.space">Open the diagnostic</a>.
    </p>
  </noscript>
</body>
</html>
