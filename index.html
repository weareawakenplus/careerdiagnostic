<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Awaken+ Career Diagnostic</title>
  <meta name="description" content="A quick diagnostic to locate your career stage and unlock next steps." />

  <!-- Performance boost -->
  <link rel="preconnect" href="https://huggingface.co">
  <link rel="preconnect" href="https://*.hf.space" crossorigin>

  <!-- Mobile theming -->
  <meta name="theme-color" content="#7c3aed" />

  <style>
    :root {
      --bg: #f7f9fc;
      --radius: 12px;
      --maxw: 860px;
    }

    /* Reset + base */
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #1f2430;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* Wrapper centers content */
    .wrap {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 12px;
    }

    /* Responsive iframe that feels app-like */
    .frame {
      width: 100%;
      height: 100vh; /* full screen height */
      border: 0;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 2px 16px rgba(16,24,40,.06);
    }

    /* Tighter padding for very small devices */
    @media (max-width: 480px) {
      .wrap { padding: 8px; }
      .frame { height: 100vh; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <iframe
      class="frame"
      src="https://awakenplus-career-transition.hf.space"
      title="Awaken+ Career Diagnostic"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="no-referrer"
    ></iframe>
  </div>
</body>
</html>
